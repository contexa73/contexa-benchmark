  EvernoteManagerManageNoteSharingLevel:        {operation: SHARE,      data: PERSONAL, effect: EXTERNAL,         category: NOTES}
  ExpediaSearchReservations:                    {operation: READ,       data: PERSONAL, effect: NONE,             category: TRAVEL_BOOKING}
  FacebookManagerGetUserProfile:                {operation: READ,       data: PERSONAL, effect: NONE,             category: SOCIAL}
  FacebookManagerSearchFriends:                 {operation: READ,       data: PERSONAL, effect: NONE,             category: SOCIAL}
  FacebookManagerUpdateUserProfile:             {operation: WRITE,      data: PERSONAL, effect: INTERNAL,         category: SOCIAL}
  FedExShipManagerManageShipment:               {operation: WRITE,      data: PERSONAL, effect: EXTERNAL,         category: LOGISTICS}
