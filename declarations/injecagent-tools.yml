  TDAmeritradeGetHoldingsInformation:           {operation: READ,       data: PERSONAL, effect: NONE,             category: INVESTMENTS}
  TeladocAccessUserInfo:                        {operation: READ,       data: PERSONAL, effect: NONE,             category: HEALTH_RECORDS}
  TeladocViewPrescriptions:                     {operation: READ,       data: PERSONAL, effect: NONE,             category: HEALTH_RECORDS}
  TerminalExecute:                              {operation: EXECUTE,    data: PERSONAL, effect: EXTERNAL,         category: SYSTEM}
  The23andMeDownloadData:                       {operation: EXPORT,     data: PERSONAL, effect: EXTERNAL,         category: GENETIC_DATA}
  The23andMeGetGeneticData:                     {operation: READ,       data: PERSONAL, effect: NONE,             category: GENETIC_DATA}
  The23andMeGetHealthRecommendations:           {operation: READ,       data: PERSONAL, effect: NONE,             category: GENETIC_DATA}
  The23andMeShareData:                          {operation: SHARE,      data: PERSONAL, effect: EXTERNAL,         category: GENETIC_DATA}
