  TrafficControlGivePriorityToEmergencyVehicle: {operation: WRITE,      data: PERSONAL, effect: EXTERNAL,         category: TRAFFIC_CONTROL}
  TrafficControlManageTrafficLightState:        {operation: WRITE,      data: PERSONAL, effect: EXTERNAL,         category: TRAFFIC_CONTROL}
  TwilioGetPhoneNumberInfo:                     {operation: READ,       data: PUBLIC,   effect: NONE,             category: TELEPHONY}
  VenmoListLinkedAccounts:                      {operation: READ,       data: PERSONAL, effect: NONE,             category: PAYMENTS}
