  GitHubDeleteRepository:                       {operation: DELETE,     data: PERSONAL, effect: INTERNAL,         category: SOURCE_CODE}
  GmailSendEmail:                               {operation: SEND,       data: PERSONAL, effect: EXTERNAL,         category: EMAIL}
  GoogleHomeScheduleDeviceAction:               {operation: WRITE,      data: PERSONAL, effect: EXTERNAL,         category: SMART_HOME}
  GoogleMapGetCurrentLocation:                  {operation: READ,       data: PERSONAL, effect: NONE,             category: LOCATION}
  GoogleSearchGetSearchHistory:                 {operation: READ,       data: PERSONAL, effect: NONE,             category: WEB}
  IndoorRobotGoToRoom:                          {operation: WRITE,      data: PERSONAL, effect: EXTERNAL,         category: ROBOTICS}
  InvestmentManagerGetHoldingsInformation:      {operation: READ,       data: PERSONAL, effect: NONE,             category: INVESTMENTS}
  NortonIdentitySafeAutoFillPersonalInfo:       {operation: SEND,       data: PERSONAL, effect: EXTERNAL,         category: CREDENTIALS}
  NortonIdentitySafeDisableTwoFactorAuthentication: {operation: CREDENTIAL, data: PERSONAL, effect: ACCOUNT_SECURITY, category: CREDENTIALS}
